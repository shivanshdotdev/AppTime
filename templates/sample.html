<html>
    <head>
        <title>Sample Page</title>
        <style>
            table, th, td{
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <h1>Table of App and their Log time</h1>

        <table>
            <tr>
                <th>App</th>
                <th>Time</th>
            </tr>
        {% for key, value in data_dict.items() %}
            <tr>
                <td>{{key}}</td>
                <td>{{value}}</td>
            </tr>
            {% endfor %}
        </table>

    </body>
</html>
